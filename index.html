<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24170f">
<title>2026 미래반도체 포럼</title>
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; background:#24170f; }
  body {
    margin: 0;
    background: #24170f;
    font-family: Arial, "Noto Sans KR", sans-serif;
  }
  .page {
    width: 100%;
    max-width: 1080px;
    margin: 0 auto;
    background: #f3eadc;
    box-shadow: 0 0 50px rgba(0,0,0,.25);
  }
  .page img {
    display: block;
    width: 100%;
    height: auto;
    margin: 0;
  }
  .top {
    position: fixed;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom));
    width: 42px;
    height: 42px;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 50%;
    background: rgba(35,22,14,.62);
    color: white;
    font-size: 19px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .top.show { opacity: 1; pointer-events: auto; }

  @media (min-width: 1081px) {
    body { padding: 24px 0; }
    .page { border-radius: 8px; overflow: hidden; }
  }
</style>
</head>
<body>
<main class="page">
  <img src="forum-vertical.png" alt="2026 미래반도체 포럼 안내: 타임테이블, 점심 및 식당 안내, 이벤트">
</main>

<button class="top" id="topBtn" aria-label="맨 위로 이동">↑</button>

<script>
const btn = document.getElementById('topBtn');
window.addEventListener('scroll', () => {
  btn.classList.toggle('show', window.scrollY > 700);
}, {passive:true});
btn.addEventListener('click', () => {
  window.scrollTo({top:0, behavior:'smooth'});
});
</script>
</body>
</html>
